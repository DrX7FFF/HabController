# Modèle HomeKit annoncé par l'accessoire (affiché à l'appairage) -> pilote
# ("homekit.fp2" pour drivers/homekit/fp2.py).
# Utilisé par l'appairage HomeKit pour déclarer l'équipement dans devices/ ; sinon déclaration à la main.
[models]
"PS-S02D" = "homekit.fp2"  # Aqara FP2 (modèle à confirmer avec ce qu'affiche l'appairage)
"PS-S02E" = "homekit.fp2"
