# Un équipement par section : l'identifiant est le nom de la section.
# "driver" choisit le type de pilote, les autres clés sont ses paramètres.

[salon]
name = "Salon"
driver = "yeelight"
host = "192.168.1.110"

[cuisine]
name = "Cuisine"
driver = "yeelight"
host = "192.168.1.111"

# Clés facultatives pour un équipement yeelight :
#   port = 55443            (défaut)
#   transition = 300        (durée par défaut des transitions, en ms)
#   capabilities = ["power", "brightness", "color_temp"]   (ex. ampoule blanche, sans rgb)
