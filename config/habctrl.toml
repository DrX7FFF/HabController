# Réglages de l'installation.

[zigbee]
# Clé Zigbee (coordinateur EmberZNet, pilotée en direct par bellows/zigpy, sans MQTT).
# Chemin stable par identifiant USB : il ne change pas si la clé passe de ttyUSB0 à ttyUSB1.
port = "/dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Plus_MG24_cccd71bbb69aef1193e6b89061ce3355-if00-port0"
baudrate = 115200
