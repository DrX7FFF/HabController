<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domotique — graphiques</title>
<link rel="stylesheet" href="/web/common.css">
<link rel="stylesheet" href="/web/vendor/uPlot.min.css">
<style>
  #toolbar { display: flex; margin-bottom: 1rem; min-height: 2.6rem; }
  #controls { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
  #controls[hidden], #unzoom[hidden], #from[hidden] { display: none; }
  #toolbar select, #toolbar button, #toolbar input {
    font-size: 1rem; padding: .5rem 1rem; border-radius: .6rem;
    border: 2px solid #888; background: #eee; cursor: pointer; }
  #toolbar .live input { padding: 0; }
  #toolbar #unzoom { background: #ffd54a; border-color: #c9a100; }
  .live { display: flex; align-items: center; gap: .4rem; padding: 0 .5rem; cursor: pointer; }
  .live input { width: 1.2rem; height: 1.2rem; }
  #charts { display: grid; gap: 1.5rem; }
  .chart { border: 2px solid #aaa; border-radius: 1rem; padding: 1rem 1.5rem; min-width: 0; }
  .chart h2 { margin-bottom: .5rem; }
  @media (max-width: 600px) { .chart { padding: .8rem; } }
</style>
</head>
<body>
<nav>
  <a href="/">Commandes</a>
  <a href="/graphiques" aria-current="page">Graphiques</a>
  <a href="/administration">Administration</a>
</nav>
<div id="banner" hidden></div>
<div id="toolbar">
  <span id="controls">
    <button id="reload">Actualiser</button>
    <label class="live"><input type="checkbox" id="live"> Direct</label>
    <select id="period" aria-label="Durée"></select>
    <input type="datetime-local" id="from" aria-label="Début">
  </span>
  <button id="unzoom" hidden>Annuler zoom</button>
</div>
<div id="charts"></div>
<script src="/web/notifications.js"></script>
<script src="/web/vendor/uPlot.iife.min.js"></script>
<script src="/web/plot.js"></script>
<script src="/web/charts.js"></script>
</body>
</html>
