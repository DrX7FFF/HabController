<ul id="notifications" hidden></ul>
<section class="sync card" data-sync="app">
  <h2>Application HabController</h2>
  <p class="state">Non contrôlé.</p>
  <button class="check">Contrôler</button>
  <button class="run main" data-confirm="Mettre à jour HabController puis le redémarrer ?">Mettre à jour et redémarrer</button>
  <span class="result"></span>
</section>
<section class="sync card" data-sync="download">
  <h2>Paramétrage à télécharger</h2>
  <p class="state">Non contrôlé.</p>
  <button class="check">Contrôler</button>
  <button class="run main">Télécharger (pull de HabConfig)</button>
  <span class="result"></span>
</section>
<section class="sync card" data-sync="load">
  <h2>Paramétrage à charger</h2>
  <p class="state">Non contrôlé.</p>
  <button class="check">Contrôler</button>
  <button class="run main">Recharger la configuration</button>
  <span class="result"></span>
  <ul id="config-errors" hidden></ul>
</section>
<section class="sync card" data-sync="save">
  <h2>Paramétrage à sauvegarder</h2>
  <p class="state">Non contrôlé.</p>
  <button class="check">Contrôler</button>
  <button class="run main">Sauvegarder (commit et push de HabConfig)</button>
  <span class="result"></span>
</section>
<section class="card">
  <h2>Appairage</h2>
  <div id="protocols"></div>
  <div id="session" hidden>
    <div id="running">
      <button id="cancel">Arrêter</button>
      <span id="wait" hidden><progress id="bar"></progress> <span id="remaining"></span></span>
      <span id="status"></span>
    </div>
    <pre id="log"></pre>
    <div id="question" hidden>
      <span id="prompt"></span>
      <form id="answer-form">
        <input id="answer" autocomplete="off">
        <button class="main">Valider</button>
      </form>
      <span id="choices"></span>
    </div>
  </div>
</section>
